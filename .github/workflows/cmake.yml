# SPDX-License-Identifier: Apache-2.0
name: CMake

on:
  push:
  pull_request:

jobs:
  host-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build
          -DZAPEE_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install
        run: cmake --install build --prefix "${{ runner.temp }}/zapee-install"

  installed-package-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ZapEE
        run: >-
          cmake -S . -B build
          -DZAPEE_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror"
      - name: Build and test ZapEE
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Install ZapEE
        run: cmake --install build --prefix "${{ runner.temp }}/zapee-install"
      - name: Configure installed-package consumer
        run: >-
          cmake -S examples/find-package-consumer
          -B consumer-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/zapee-install"
      - name: Build and run installed-package consumer
        run: |
          cmake --build consumer-build --parallel
          ./consumer-build/zapee_find_package_consumer


  sparse-component-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep only the ZTM_PWM component graph
        run: |
          git sparse-checkout init --cone
          git sparse-checkout set cmake include zephyr platform drivers/sx1509 drivers/pac195x drivers/emc2303 modules/ztm_pwm
          test ! -e modules/ztm_adc
          test ! -e drivers/ad7124
      - name: Configure sparse ZapEE tree
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror"
      - name: Build sparse ZapEE tree
        run: cmake --build build --parallel
