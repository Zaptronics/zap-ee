# Zap package metadata. Used by the optional native `zap` tool for sparse checkout.
schema: 1

package:
  name: ZapEE
  description: Zaptronics Embedded Electronics Library
  cmake_project: ZapEE
  paths:
    - cmake
    - include
    - zephyr

components:
  zap::core:
    kind: core
    description: ZapEE common C11 interface and version headers

  zap::i2c:
    kind: transport
    description: Portable I2C transport abstraction
    paths:
      - platform

  zap::spi:
    kind: transport
    description: Portable SPI transport abstraction
    paths:
      - platform

  zap::spi_framed:
    kind: transport
    description: Portable framed SPI abstraction with sequence-level ownership and CS pulse per frame
    depends:
      - zap::spi
    paths:
      - platform

  zap::sx1509:
    kind: driver
    description: Semtech SX1509 GPIO/PWM expander driver
    depends:
      - zap::i2c
    paths:
      - drivers/sx1509

  zap::pac195x:
    kind: driver
    description: Microchip PAC195x current/voltage monitor driver
    depends:
      - zap::i2c
    paths:
      - drivers/pac195x

  zap::emc2303:
    kind: driver
    description: Microchip EMC2303 fan controller driver
    depends:
      - zap::i2c
    paths:
      - drivers/emc2303

  zap::ad7124:
    kind: driver
    description: Analog Devices AD7124 precision ADC driver
    depends:
      - zap::spi
    paths:
      - drivers/ad7124

  zap::thermocouple:
    kind: driver
    description: Portable thermocouple conversion helpers
    paths:
      - drivers/thermocouple

  zap::ad5282:
    kind: driver
    description: Analog Devices AD5282 dual digital potentiometer
    depends:
      - zap::i2c
    paths:
      - drivers/ad5282

  zap::mcp4901:
    kind: driver
    description: Microchip MCP4901 DAC
    depends:
      - zap::spi
    paths:
      - drivers/mcp4901

  zap::ztm_psu_hv:
    kind: module
    description: Zaptronics high voltage PSU
    depends:
      - zap::ad5282
      - zap::i2c
    paths:
      - modules/ztm_psu_hv

  zap::ztm_psu_tec:
    kind: module
    description: Zaptronics thermoelectric cooler PSU
    depends:
      - zap::mcp4901
      - zap::spi
    paths:
      - modules/ztm_psu_tec

  zap::l6470:
    kind: driver
    description: ST L6470 stepper driver protocol codecs and conversion helpers
    paths:
      - drivers/l6470

  zap::ztm_pwm:
    kind: module
    description: Zaptronics ZTM_PWM module
    pico: zap::pico_ztm_pwm
    zephyr: zap::zephyr_ztm_pwm
    depends:
      - zap::sx1509
      - zap::pac195x
      - zap::emc2303
    paths:
      - modules/ztm_pwm

  zap::ztm_adc:
    kind: module
    description: Zaptronics ZTM_ADC module
    pico: zap::pico_ztm_adc
    zephyr: zap::zephyr_ztm_adc
    depends:
      - zap::ad7124
      - zap::thermocouple
    paths:
      - modules/ztm_adc

  zap::ztm_stepper:
    kind: module
    description: Zaptronics ZTM_STEPPER four-L6470 module
    depends:
      - zap::l6470
      - zap::spi_framed
    paths:
      - modules/ztm_stepper

  zap::pico:
    kind: platform
    description: Raspberry Pi Pico SDK transport/time/locking adapters
    depends:
      - zap::i2c
      - zap::spi
      - zap::spi_framed
    paths:
      - platform

  zap::pico_ztm_pwm:
    kind: adapter
    description: Pico SDK adapter for ZTM_PWM
    depends:
      - zap::pico
      - zap::ztm_pwm
    paths:
      - platform

  zap::pico_ztm_adc:
    kind: adapter
    description: Pico SDK adapter for ZTM_ADC
    depends:
      - zap::pico
      - zap::ztm_adc
    paths:
      - platform

  zap::zephyr:
    kind: platform
    description: Zephyr transport/time/locking adapters
    depends:
      - zap::i2c
      - zap::spi
    paths:
      - platform

  zap::zephyr_ztm_pwm:
    kind: adapter
    description: Zephyr adapter for ZTM_PWM
    depends:
      - zap::zephyr
      - zap::ztm_pwm
    paths:
      - platform

  zap::zephyr_ztm_adc:
    kind: adapter
    description: Zephyr adapter for ZTM_ADC
    depends:
      - zap::zephyr
      - zap::ztm_adc
    paths:
      - platform

  zap::pcal6416:
    kind: driver
    description: Portable PCAL6416A GPIO expander
    depends:
      - zap::i2c
    paths:
      - drivers/pcal6416

  zap::tla2518:
    kind: driver
    description: Portable TLA2518 ADC with framed SPI
    depends:
      - zap::spi_framed
    paths:
      - drivers/tla2518

  zap::pico_ztpico2:
    kind: board
    description: ZTPICO2 motherboard support for Pico SDK
    depends:
      - zap::pcal6416
      - zap::tla2518
      - zap::i2c
      - zap::spi
      - zap::spi_framed
    paths:
      - boards

  zap::registry:
    kind: service
    description: Explicit module registry and lifecycle
    paths:
      - services/registry

  zap::cli:
    kind: service
    description: Portable command tokenization and argument parsing
    paths:
      - services/cli

  zap::log:
    kind: service
    description: Portable formatted logging with configurable submission
    paths:
      - services/log

  zap::pico_log:
    kind: service
    description: Pico queued logging with an application output sink
    depends:
      - zap::log
    paths:
      - services/pico

  zap::pico_network:
    kind: service
    description: Optional Pico WiFi CLI and HTTP services
    depends:
      - zap::log
    paths:
      - services/pico_network

  zap::pico_ztpico2_ztm_psu_tec:
    kind: adapter
    description: ZTPICO2 binding for caller-owned ZTM_PSU_TEC instances
    depends:
      - zap::pico_ztpico2
      - zap::ztm_psu_tec
    paths:
      - boards

  zap::pico_ztpico2_ztm_pwm:
    kind: adapter
    description: ZTPICO2 binding for caller-owned ZTM_PWM instances
    depends:
      - zap::pico_ztpico2
      - zap::ztm_pwm
    paths:
      - boards

  zap::pico_ztpico2_ztm_adc:
    kind: adapter
    description: ZTPICO2 SPI and operation-lock binding for ZTM_ADC
    depends:
      - zap::pico_ztpico2
      - zap::ztm_adc
    paths:
      - boards

  zap::pico_ztpico2_ztm_stepper:
    kind: adapter
    description: ZTPICO2 Framed SPI, operation-lock and power binding for ZTM_STEPPER
    depends:
      - zap::pico_ztpico2
      - zap::ztm_stepper
    paths:
      - boards
